services:

  # ── OmniRouter：GitHub Copilot → OpenAI-compatible proxy ─────────────────
  omni-router:
    image: ${OMNI_ROUTER_IMAGE:-ghcr.io/diegosouzapw/omniroute:latest}
    restart: "no"
    environment:
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
    ports:
      - "20128:20128"
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:20128/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  # ── news-digest：本專案主程式 ─────────────────────────────────────────────
  news-digest:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      omni-router:
        condition: service_healthy
    environment:
      # OmniRouter 預設跑在 20128
      OMNI_BASE_URL: "http://omni-router:20128/v1"
      OMNI_API_KEY: ${OMNI_API_KEY}
      SEARCH_MODEL: ${SEARCH_MODEL:-auto/best-chat}
      NEWS_API_KEY: ${NEWS_API_KEY}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_TARGET_IDS: ${LINE_TARGET_IDS}
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Taipei"
    networks:
      - internal
    command: ["python", "main_daily.py"]

networks:
  internal:
    driver: bridge

volumes:
  omniroute-data:
    external: true
    name: news-digest_omniroute-data
