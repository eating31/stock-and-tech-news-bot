
name: News Digest

on:
  schedule:
    - cron: "30 0 * * *" # 台灣時間每天早上 08:30 (轉換為 UTC 00:30)
    - cron: "0 0 * * 1" # 台灣時間每週一早上 08:00 (轉換為 UTC 00:00)

  workflow_dispatch:
    inputs:
      task:
        description: "要執行的任務"
        type: choice
        options:
          - daily
          - weekly
        default: daily
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  run-news-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
      OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TARGET_IDS: ${{ secrets.LINE_TARGET_IDS }}
      SEARCH_MODEL: ${{ vars.SEARCH_MODEL || 'auto/best-chat' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          for name in \
            STORAGE_ENCRYPTION_KEY \
            OMNI_API_KEY \
            NEWS_API_KEY \
            LINE_CHANNEL_ACCESS_TOKEN \
            LINE_TARGET_IDS \
            GCP_WIF_PROVIDER \
            GCP_SERVICE_ACCOUNT
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Validate WIF provider format
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail

          case "$WIF_PROVIDER" in
            projects/*/locations/global/workloadIdentityPools/*/providers/*)
              echo "Provider resource name format: OK"
              ;;
            *)
              echo "::error::Provider must start with projects/ and include /providers/PROVIDER_ID"
              exit 1
              ;;
          esac

          if [[ "$WIF_PROVIDER" == *"https://"* ]]; then
            echo "::error::Remove the https:// prefix from the GitHub Secret"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Download SQLite from GCS
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p "$RUNNER_TEMP/omniroute"

          gcloud storage cp \
            gs://omniroute-key/storage.sqlite \
            "$RUNNER_TEMP/omniroute/storage.sqlite"

          test -s "$RUNNER_TEMP/omniroute/storage.sqlite"

      - name: Prepare Docker volume
        shell: bash
        run: |
          set -euo pipefail

          docker volume create news-digest_omniroute-data

          docker run --rm \
            -v news-digest_omniroute-data:/app/data \
            -v "$RUNNER_TEMP/omniroute:/backup:ro" \
            alpine:3.20 \
            sh -c \
            'cp /backup/storage.sqlite /app/data/storage.sqlite &&
             chown -R 1000:1000 /app/data'

      - name: Start OmniRouter
        run: docker compose up -d omni-router

      - name: Run daily or weekly task
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          TASK_INPUT: ${{ inputs.task }}
        run: |
          set -euo pipefail

          case "${SCHEDULE_CRON:-}" in
            "0 8 * * 1")
              TASK="weekly"
              ;;
            "30 8 * * *")
              TASK="daily"
              ;;
            *)
              TASK="${TASK_INPUT:-daily}"
              ;;
          esac

          case "$TASK" in
            daily)
              docker compose run --rm news-digest \
                python main_daily.py
              ;;
            weekly)
              docker compose run --rm news-digest \
                python main_weekly.py
              ;;
            *)
              echo "::error::Unknown task: $TASK"
              exit 1
              ;;
          esac

      - name: Clean up
        if: always()
        shell: bash
        run: |
          docker compose down --remove-orphans || true
          docker volume rm news-digest_omniroute-data || true
          rm -rf "$RUNNER_TEMP/omniroute"
